spring.application.name=ghostwrite-backend
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ghostwrite_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:lisa0913}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Multipart File Upload
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
file.upload-dir=uploads

# JWT Security
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# AI Configuration (Supports MOCK AI MODE and REAL GEMINI AI MODE)
ai.provider=${AI_PROVIDER:mock}
ai.api-key=${GEMINI_API_KEY:${AI_API_KEY:}}
gemini.api-key=${GEMINI_API_KEY:${AI_API_KEY:}}
gemini.model=${GEMINI_MODEL:${AI_MODEL:gemini-1.5-flash}}

# Scheduling & Escalation
app.escalation.enabled=true
app.escalation.cron=0 */15 * * * *

# Logging
logging.level.com.ghostwrite=INFO
logging.level.org.springframework.security=WARN
